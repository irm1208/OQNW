<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />

    <!-- Primary SEO -->
    <title>OmniQure Peptide Research Institute — Verified Research Peptides</title>
    <meta name="description" content="Buy high-purity research peptides with independent results confirming 99%+ purity. BPC-157, TB-500, Ipamorelin, CJC-1295, Epithalon and 100+ peptides. Worldwide shipping. For research use only." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="OmniQure Peptide Research Institute" />
    <!-- Browser auto-translate: lang="en" on <html> is already set; content-language tells Chrome/Safari/Edge to offer translation to non-English visitors -->
    <meta http-equiv="content-language" content="en" />
    <meta name="keywords" content="research peptides, BPC-157, TB-500, Epithalon, Ipamorelin, CJC-1295, verified peptides, peptide research" />
    <link rel="canonical" href="https://omniqure.com/" />

    <!-- Open Graph — Facebook, LinkedIn, WhatsApp, Discord, Slack, iMessage previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OmniQure Peptide Research Institute" />
    <meta property="og:title" content="OmniQure Peptide Research Institute — Verified Research Peptides" />
    <meta property="og:description" content="Buy high-purity research peptides with independent results confirming 99%+ purity. BPC-157, TB-500, Ipamorelin, CJC-1295, Epithalon and 100+ peptides. Worldwide shipping. For research use only." />
    <meta property="og:image" content="https://omniqure.com/opengraph.jpg?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OmniQure Peptide Research Institute — Verified Research Peptides" />
    <meta property="og:url" content="https://omniqure.com/" />
    <meta property="og:locale" content="en" />

    <!-- Twitter / X Cards — summary_large_image for rich link previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OmniQure Peptide Research Institute — Verified Research Peptides" />
    <meta name="twitter:description" content="Buy high-purity research peptides with independent results confirming 99%+ purity. BPC-157, TB-500, Ipamorelin and 100+ peptides. Worldwide shipping." />
    <meta name="twitter:image" content="https://omniqure.com/opengraph.jpg?v=4" />
    <meta name="twitter:image:alt" content="OmniQure Peptide Research Institute" />

    <!-- PWA / Mobile platforms -->
    <meta name="theme-color" content="#1240A0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OmniQure" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Microsoft / Windows tiles -->
    <meta name="msapplication-TileColor" content="#1240A0" />
    <meta name="msapplication-TileImage" content="/omniqure-logo.png" />
    <meta name="msapplication-config" content="none" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- JSON-LD: Organization + WebSite (always present, page-level overrides added by useSEO hook) -->
    <script type="application/ld+json" data-seo="organization">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://omniqure.com/#organization",
          "name": "OmniQure Peptide Research Institute",
          "url": "https://omniqure.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://omniqure.com/omniqure-logo.png",
            "width": 512,
            "height": 512
          },
          "description": "High-purity research peptides with independent results confirming 99%+ purity. BPC-157, TB-500, Ipamorelin and 100+ peptides. For research use only.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "availableLanguage": "English"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://omniqure.com/#website",
          "url": "https://omniqure.com",
          "name": "OmniQure Peptide Research Institute",
          "publisher": { "@id": "https://omniqure.com/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://omniqure.com/all-peptides?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Preload LCP hero image -->
    <link rel="preload" as="image" href="/hero-vials-2.webp" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
