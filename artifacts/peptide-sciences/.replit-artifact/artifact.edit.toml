kind = "web"
previewPath = "/"
title = "OmniQure Storefront"
version = "1.0.0"
id = "artifact:v3:default-omniqure-storefront"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25553

[services.development]
run = "pnpm --filter @workspace/peptide-sciences run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/peptide-sciences", "run", "build" ]
publicDir = "artifacts/peptide-sciences/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25553"
BASE_PATH = "/"
