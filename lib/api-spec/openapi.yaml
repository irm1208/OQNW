openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: OmniQure API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-auth
    description: Admin authentication
  - name: admin-dashboard
    description: Admin dashboard stats
  - name: admin-orders
    description: Admin order management
  - name: admin-customers
    description: Admin customer management
  - name: admin-products
    description: Admin product/inventory management
  - name: admin-discounts
    description: Admin discount code management
  - name: admin-catalog
    description: Admin full product catalog CRUD
  - name: public-products
    description: Public storefront product endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Admin logout
      responses:
        "204":
          description: Logged out

  /admin/auth/me:
    get:
      operationId: adminMe
      tags: [admin-auth]
      summary: Check admin session
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/test-payments/session:
    post:
      operationId: createAdminWallidTestPaymentSession
      tags: [admin-auth]
      summary: Create a one-time £1 Wallid test checkout
      responses:
        "201":
          description: Test checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWallidTestPaymentSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/test-payments/crypto-session:
    post:
      operationId: createAdminCryptoTestPaymentSession
      tags: [admin-auth]
      summary: Create a one-time £1 crypto test checkout
      responses:
        "201":
          description: Test checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCryptoTestPaymentSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No crypto payment route is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/dashboard/revenue:
    get:
      operationId: getRevenueChart
      tags: [admin-dashboard]
      summary: Get daily revenue for the specified period
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30, 90, 365]
            default: 30
      responses:
        "200":
          description: Revenue chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueDataPoint"

  /admin/dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [admin-dashboard]
      summary: Get top selling products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /admin/dashboard/new-customers:
    get:
      operationId: getNewCustomersChart
      tags: [admin-dashboard]
      summary: Get daily new customer registrations for the specified period
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30, 90, 365]
            default: 30
      responses:
        "200":
          description: New customers chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewCustomerDataPoint"

  /admin/dashboard/order-status:
    get:
      operationId: getOrderStatusBreakdown
      tags: [admin-dashboard]
      summary: Get order counts grouped by status
      responses:
        "200":
          description: Order status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderStatusCount"

  /admin/dashboard/revenue-by-category:
    get:
      operationId: getRevenueByCategoryChart
      tags: [admin-dashboard]
      summary: Get total revenue grouped by product category
      responses:
        "200":
          description: Revenue by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryRevenue"

  # ── ORDERS ────────────────────────────────────────────────────────────────
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin-orders]
      summary: List all orders with optional filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"

  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      tags: [admin-orders]
      summary: Get order detail with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminOrder
      tags: [admin-orders]
      summary: Update order status, tracking, or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/orders/{id}/dispatch:
    post:
      operationId: dispatchAdminOrder
      tags: [admin-orders]
      summary: Dispatch an order and send its tracking notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchOrderInput"
      responses:
        "200":
          description: Order dispatched and notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrderResponse"
        "202":
          description: Order dispatched but notification delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrderResponse"
        "400":
          description: Invalid dispatch details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Order is not ready to dispatch or was already dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/orders/{id}/send-tracking:
    post:
      operationId: resendAdminOrderTracking
      tags: [admin-orders]
      summary: Resend the tracking notification for a dispatched order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResult"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Order has not been dispatched or tracking details are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/track:
    get:
      operationId: trackPublicOrder
      tags: [orders]
      summary: Track an order by its public order number
      parameters:
        - name: number
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Limited public order tracking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrderTracking"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── CUSTOMERS ─────────────────────────────────────────────────────────────
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin-customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated list of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"

  /admin/customers/{id}:
    get:
      operationId: getAdminCustomer
      tags: [admin-customers]
      summary: Get customer detail with order history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/customer-segments:
    get:
      operationId: listAdminCustomerSegments
      tags: [admin-customers]
      summary: List active dynamic customer segments with live match counts
      responses:
        "200":
          description: Active customer segments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSegmentList"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAdminCustomerSegment
      tags: [admin-customers]
      summary: Create a dynamic customer segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSegmentInput"
      responses:
        "201":
          description: Created customer segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSegmentResponse"
        "400":
          description: Invalid segment rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/customer-segments/{id}:
    get:
      operationId: getAdminCustomerSegment
      tags: [admin-customers]
      summary: Get a segment and paginated live matching members
      parameters:
        - $ref: "#/components/parameters/CustomerSegmentId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Segment detail and matching members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSegmentDetail"
        "400":
          description: Invalid identifier or pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Segment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminCustomerSegment
      tags: [admin-customers]
      summary: Update a dynamic customer segment
      parameters:
        - $ref: "#/components/parameters/CustomerSegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSegmentPatch"
      responses:
        "200":
          description: Updated customer segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSegmentResponse"
        "400":
          description: Invalid segment rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Segment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveAdminCustomerSegment
      tags: [admin-customers]
      summary: Archive a customer segment
      parameters:
        - $ref: "#/components/parameters/CustomerSegmentId"
      responses:
        "204":
          description: Archived
        "404":
          description: Segment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── PRODUCTS / INVENTORY ──────────────────────────────────────────────────
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin-products]
      summary: List all products with stock levels
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: lowStock
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products with inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"

  /admin/products/{id}/inventory:
    patch:
      operationId: updateProductInventory
      tags: [admin-products]
      summary: Update product stock level and threshold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated product inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/products/{id}/visibility:
    patch:
      operationId: updateProductVisibility
      tags: [admin-products]
      summary: Toggle product published/draft status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityUpdate"
      responses:
        "200":
          description: Updated product visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"

  # ── DISCOUNT CODES ────────────────────────────────────────────────────────
  /admin/discounts:
    get:
      operationId: listAdminDiscounts
      tags: [admin-discounts]
      summary: List all discount codes
      responses:
        "200":
          description: List of discount codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscountCode"
    post:
      operationId: createAdminDiscount
      tags: [admin-discounts]
      summary: Create a new discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCodeInput"
      responses:
        "201":
          description: Created discount code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/discounts/{id}:
    patch:
      operationId: updateAdminDiscount
      tags: [admin-discounts]
      summary: Update a discount code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCodePatch"
      responses:
        "200":
          description: Updated discount code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminDiscount
      tags: [admin-discounts]
      summary: Delete a discount code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── CATALOG (admin full CRUD) ────────────────────────────────────────────
  /admin/catalog:
    get:
      operationId: listCatalogProducts
      tags: [admin-catalog]
      summary: List all products in the catalog
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: published
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogProduct"
    post:
      operationId: createCatalogProduct
      tags: [admin-catalog]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog/disable-without-janoshik-report:
    post:
      operationId: disableCatalogProductsWithoutJanoshikReport
      tags: [admin-catalog]
      summary: Disable catalog products without a Janoshik report
      responses:
        "200":
          description: Products disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisableCatalogProductsWithoutJanoshikReportResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog/enable-all-peptides:
    post:
      operationId: enableAllPeptideCatalogProducts
      tags: [admin-catalog]
      summary: Re-enable all peptide products in the catalog
      responses:
        "200":
          description: Peptide products enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnableAllPeptideCatalogProductsResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog/price-sync/preview:
    post:
      operationId: previewCatalogPriceSync
      tags: [admin-catalog]
      summary: Preview a slug-keyed price-only catalogue sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogPriceSyncPreviewRequest"
      responses:
        "200":
          description: Reviewable production price diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPriceSyncPreview"
        "400":
          description: Invalid price rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog/price-sync/apply:
    post:
      operationId: applyCatalogPriceSync
      tags: [admin-catalog]
      summary: Apply an explicitly confirmed price-only catalogue sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogPriceSyncApplyRequest"
      responses:
        "200":
          description: Confirmed production prices updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPriceSyncApplyResponse"
        "400":
          description: Invalid or unconfirmed price diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A production price changed after preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog/{id}:
    get:
      operationId: getCatalogProduct
      tags: [admin-catalog]
      summary: Get a single catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Catalog product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCatalogProduct
      tags: [admin-catalog]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogProductPatch"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCatalogProduct
      tags: [admin-catalog]
      summary: Delete a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── PUBLIC PRODUCTS ───────────────────────────────────────────────────────
  /products:
    get:
      operationId: listPublicProducts
      tags: [public-products]
      summary: List published products for the storefront
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"

  /products/{slug}:
    get:
      operationId: getPublicProduct
      tags: [public-products]
      summary: Get a single published product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── SECURITY ───────────────────────────────────────────────────────────────
  /admin/audit-history:
    get:
      operationId: listAdminAuditHistory
      tags: [admin-auth]
      summary: List administrator audit history
      description: Owner-only, paginated audit history for administrator authentication and account-management activity.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: eventType
          in: query
          required: false
          schema: { type: string }
        - name: success
          in: query
          required: false
          schema: { type: boolean }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Filtered audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditHistory"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
