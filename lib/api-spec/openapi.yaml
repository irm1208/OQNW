    CustomerSegmentCondition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [field, operator, value]
          properties:
            field: { type: string, enum: [total_orders, total_spend_gbp, days_since_last_order, account_age_days] }
            operator: { type: string, enum: [gte, lte] }
            value: { type: number, minimum: 0, maximum: 1000000000 }
        - type: object
          additionalProperties: false
          required: [field, operator, value]
          properties:
            field: { type: string, enum: [marketing_status] }
            operator: { type: string, enum: [equals] }
            value: { type: string, enum: [subscribed, unsubscribed] }
        - type: object
          additionalProperties: false
          required: [field, operator, value]
          properties:
            field: { type: string, enum: [has_abandoned_cart, has_wholesale_order, is_referred, is_affiliate] }
            operator: { type: string, enum: [equals] }
            value: { type: boolean }
    CustomerSegmentRules:
      type: object
      additionalProperties: false
      required: [matchMode, conditions]
      properties:
        matchMode: { type: string, enum: [all] }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CustomerSegmentCondition" }
    CustomerSegmentInput:
      type: object
      additionalProperties: false
      required: [name, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
